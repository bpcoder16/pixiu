env:
  # 应用名称，复制到具体项目后修改；必填。
  appName: "example-http"

  # debug / test / release；必填。
  runMode: "debug"

  # 应用时区，加载时校验并解析，不自动修改进程时区；必填。
  timeLocation: "Asia/Shanghai"

  # 可选 IPv4 / IPv6；空字符串在初始化时先查询本机 IPv4，失败后查询 IPv6，再失败则保持为空。
  localIP: ""

log:
  # text / json；必填。release 输出 Info 及以上，其他模式输出 Debug 及以上。
  format: "json"
  # 是否输出调用位置；默认 false，对默认及命名 Logger 同时生效。
  caller: false
  # 日志目录，默认 ./log；相对路径拼接 env.RootDirPath()，绝对路径直接使用。
  # 不存在时自动创建；启动时检查目录可写权限。
  dir: "./log"
  # 额外的命名 Logger，可通过 logit.Named(name) 或 WithLoggerName(ctx, name) 选择。
  # 每个 Logger 分流为 .debug.log / .info.log / .wf.log（Warn、Error、Fatal）。
  names: []
  # 固定使用 rotatefile；时间戳和轮转边界使用进程本地时区。
  rotate:
    # 按本地整小时（1h）或整天（24h）轮转，默认 1h。
    every: "1h"
    # 保留实际文件数量（含当前文件，不含软链），默认 48，最小 3。
    maxFiles: 48
