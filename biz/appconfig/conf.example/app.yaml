env:
  # 应用名称，复制到具体项目后修改；必填。
  appName: "example-http"

  # debug / test / release；必填。
  # 使用 bootstrap.NewGinEngine 时，debug/test 自动开放 OpenAPI 与 Elements，须先生成并导入文档包；release 关闭。
  runMode: "debug"

  # 应用时区，加载时校验并解析；bootstrap 在日志初始化前应用为 time.Local；必填。
  timeLocation: "Asia/Shanghai"

  # 可选 IPv4 / IPv6；空字符串在初始化时先查询本机 IPv4，失败后查询 IPv6，再失败则保持为空。
  localIP: ""

log:
  # 是否劫持 stdout/stderr；省略时默认 true，仅支持 Linux/macOS。
  # 原始输出分别追加到 dir/<appName>/std/stdout.log 和 dir/<appName>/std/stderr.log。
  # std 目录自动创建，文件不轮转；资源栈关闭后仍生效，直到进程退出。
  hookStd: true

  # text / json；必填。release 输出 Info 及以上，其他模式输出 Debug 及以上。
  format: "json"
  # 是否输出调用位置；默认 false，对默认及命名 Logger 同时生效。
  caller: false
  # 日志根目录，默认 ./log；相对路径拼接 env.RootDirPath()，绝对路径直接使用。
  # 业务日志位于 dir/<appName>/biz；不存在时自动创建，启动时检查目录可写权限。
  dir: "./log"
  # 额外的命名 Logger，可通过 logit.Named(name) 或 WithLoggerName(ctx, name) 选择。
  # 默认文件为 debug.log / info.log / wf.log（Warn、Error、Fatal）；命名 Logger 增加 <name>. 前缀。
  names: []
  # 固定使用 rotatefile；时间戳和轮转边界使用进程本地时区。
  rotate:
    # 按本地整小时（1h）或整天（24h）轮转，默认 1h。
    every: "1h"
    # 保留实际文件数量（含当前文件，不含软链），默认 48，最小 3。
    maxFiles: 48
