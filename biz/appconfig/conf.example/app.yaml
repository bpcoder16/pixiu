env:
  # 必填。应用名也是日志子目录名，请使用单个目录名。
  appName: "example-http"
  # 必填。可选 debug、test、release。release 从 Info 级别记录日志，其余从 Debug 开始。
  runMode: "debug"
  # 必填。进程时区，也用于确定日志轮转时间。
  timeLocation: "Asia/Shanghai"
  # 本机 IP。留空时先查 IPv4，再查 IPv6。
  localIP: ""

log:
  # 必填。日志格式可选 json 或 text。
  format: "json"
  # 是否记录调用处的文件名和行号，默认 false。
  caller: false
  # 是否将 stdout、stderr 写入 <dir>/<appName>/std/。默认 true，支持 Linux 和 macOS。
  hookStd: true
  # 日志根目录，默认 ./log。相对路径从进程启动目录计算，应用日志写入 <dir>/<appName>/biz/。
  dir: "./log"
  # 额外的日志名称，例如 [audit] 会生成 audit.info.log 等文件。
  names: []
  rotate:
    # 按本地整点（1h）或午夜（24h）轮转，默认 1h。
    every: "1h"
    # 每组日志保留的文件数，含当前文件。默认 48，最少 3。
    maxFiles: 48

# 关闭所有已登记资源的总时限。省略或设为 0s 时使用 30s，负值无效。
resourceCloseTimeout: "30s"

# 可填 http、cron、nats-consumer。类型匹配全部实例，“类型:实例名”只匹配指定实例。
# 例如 ["nats-consumer:orders"] 只关闭 orders 消费者。空列表表示启用代码声明的全部服务。
disabledServices: []
