# 与 app.yaml 放在同一目录，由 bootstrap.NewCronService 读取。
loggerName: "cron"  # 在 app.yaml 的 log.names 声明此名称可写入独立文件，否则使用默认日志

# 可选 Redis 调度锁。同组副本共用 Redis 数据库、锁前缀和任务名，未获锁的副本跳过本轮。
# 启用时，在 MustBaseInit 前声明 Redis 实例，并取消下列配置的注释。
# lock:
#   redisName: "cron-lock"        # 已初始化的 Redis 实例名
#   keyPrefix: "demo:prod:cron:"  # 不同应用或环境使用不同前缀
#   ttl: "30s"                    # 锁租期，默认 30s
#   renewInterval: "10s"          # 续租间隔，默认 ttl 的三分之一，须小于 ttl

# name 须与已注册的 Handler 名称完全一致，区分大小写。用 jobs: [] 停用全部任务，修改后重启生效。
# 每项只选 every、cron、randomEvery 中的一种。固定和随机间隔首次执行前都会等待。
# 同一进程内，同名任务仍在运行时跳过本轮。
# cron 按 env.timeLocation 解析，依次填写秒、分、时、日、月、周，不支持内嵌时区或 @daily。
# timeout 默认不限时，启用锁时须设置正时长。超时取消任务上下文，Handler 返回后释放锁。
# successLevel 可选 info（默认）或 debug。
jobs:
  - name: "scan-orders"
    every: "1s"            # 固定间隔，每秒一次，最短 100ms
    timeout: "20s"
    successLevel: "debug"

  - name: "daily-report"
    cron: "0 10 0 * * *"   # 每天 00:10 执行
    timeout: "10m"
    successLevel: "info"

  - name: "popup-push"
    randomEvery:           # 每轮重新选取间隔，范围为 [min, max)
      min: "15m"           # 最短 100ms
      max: "20m"           # 须大于 min
    timeout: "2m"
    successLevel: "info"
