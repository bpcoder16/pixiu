# 复制为 nats-register.<name>.yaml，与 nats.<name>.yaml 放在同一配置目录。
# 由依赖就绪后的 NewNATSConsumerService 读取，服务 Run 时启动消费；不随 MustBaseInit 自动启动。
# namespace 在 nats.<name>.yaml 中配置，本文件不接受该字段。
# 此处填写原始名称和主题；Client 为注册、发布和 Request 统一添加前缀。
# 例如 namespace 为 test1 时，名称及非空 queue 添加 test1_，主题添加 test1.。
# Handler 名称不变，回调主题保留前缀；修改 namespace 不迁移或删除旧 Stream/Durable。

streamDefaults:
  # 始终必填且为正整数，同时作为逐项副本数的上限，即使没有 Stream 或每个 Stream 均有覆盖值。
  # 单节点使用 1；服务端继续校验副本数范围与集群条件。
  replicas: 1

streams:
  - name: "ORDERS"
    subjects:
      - "orders.>"
    # 以下四项均可省略或设为 null，按需取消注释覆盖。
    # replicas 沿用 streamDefaults.replicas；其余三项沿用 natsx Default，注释中列出当前默认值。
    # replicas: 1          # 不得超过全局值；0 或负数也沿用全局值，解码及数字转换沿用 configx。
    # retention: "limits"  # 可选 limits、interest、workqueue。
    # maxAge: "2160h"      # 消息最大年龄；0 表示不限制年龄。支持 Go 时长单位，不支持 d。
    # duplicates: "2m"     # 消息 ID 去重窗口；0 由服务端确定，不代表关闭去重。
    # 时长范围由服务端校验；maxAge 大于 0 时，去重窗口不得超过它。

# 下面的 Handler 须由应用的 JetStreamHandlerRegistry 登记。
jetStreamConsumers:
  - stream: "ORDERS"
    durable: "order-created-worker"
    filterSubjects:
      - "orders.created"
    handler: "HandleOrderCreated"
    # 以下六项均可省略或设为 null，沿用 natsx Default；注释中列出当前默认值。
    # ackWait: "60s"       # ACK 等待时间，必须大于 0；应覆盖预取等待和业务处理时间。
    # maxDeliver: 5        # 最大投递次数，包含首次；范围由服务端校验。
    # maxAckPending: 1000  # 同一 Durable 下所有实例合计的未确认消息数上限。
    # consume:
    #   workers: 1         # 本地并发数；0 按 1 处理，Handler 须支持并发。
    #   maxMessages: 0     # SDK 预取上限；0 为有效 workers 的两倍，不含处理中的消息。
    # retryDelay: "0s"     # 失败重投延迟；0 等待 ackWait 超时，正值发送延迟 NAK。
    # ackWait、retryDelay 支持 Go 时长单位；workers、maxMessages、retryDelay 不得为负。

# 下面的 Handler 须由应用的 CoreHandlerRegistry 登记。
coreConsumers:
  - name: "config-refresh"
    subject: "config.refresh"
    handler: "HandleConfigRefresh"
  - name: "notification-worker"
    subject: "notifications.send"
    queue: "notification-workers"
    # queue 非空时必须配置且大于 1；当前 Client 按此数量建订阅，Handler 须支持并发。
    subscribers: 4
    handler: "HandleNotification"

# 三份清单均可省略或设为 []；未引用的 Handler 不启动。
# filterSubjects 省略或为空时消费整个 Stream；queue 省略或为空时广播。
# subscribers 仅在 queue 非空时控制订阅数，广播始终只有一个订阅。
# 除上述字段外全部沿用 natsx 的 Default，不支持 enabled、热更新或完整 SDK 配置。
# 删除声明后重启不删除远端 Stream/Durable；同配置复用，冲突报错，不自动更新。
