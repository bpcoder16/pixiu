# 与 nats.<实例名>.yaml 放在同一目录，部署时命名为 nats-register.<实例名>.yaml。
# 名称和主题填原值，客户端自动添加 namespace 前缀。handler 填注册名，区分大小写。

# Core 订阅。省略 queue 时广播，配置 queue 时由同组订阅分担消息。
coreConsumers:
  - name: "config-refresh"
    subject: "config.refresh"
    handler: "HandleConfigRefresh"

  - name: "notification-worker"
    subject: "notifications.send"
    queue: "notification-workers"  # 同组只有一个订阅处理每条消息
    subscribers: 4                 # 配置 queue 时必填且大于 1，表示每个实例的订阅数
    handler: "HandleNotification"

# 默认按连接配置的 urls 条目数设置副本数。使用种子地址或代理时可显式指定。
# streamDefaults:
#   replicas: 1  # 正整数，也是单个 Stream 的副本数上限

# JetStream 订阅需要服务端开启 JetStream。
# Stream 和 Durable 各自选择模式。create 创建或复用相同配置，upsert 按完整配置创建或更新。
streams:
  - name: "ORDERS"
    # mode: "create"  # 可选 create（默认）、upsert、existing。existing 只引用已有 Stream
    subjects:  # create、upsert 必填
      - "orders.>"
    # replicas: 1          # 默认沿用全局副本数
    # maxBytes: -1         # 容量上限，单位字节，默认 -1 表示不限
    # retention: "limits"  # 可选 limits、interest、workqueue
    # maxAge: "2160h"      # 消息保留时间，0s 表示不限
    # duplicates: "2m"     # 消息 ID 去重窗口
    consumers:
      - durable: "order-created-worker"
        # mode: "create"  # 可选 create（默认）、upsert
        filterSubjects:  # 留空时消费整个 Stream
          - "orders.created"
        handler: "HandleOrderCreated"
        # ackWait: "60s"       # 从投递到确认的时限
        # maxDeliver: 5        # 最大投递次数，含首次
        # maxAckPending: 1000  # 同一 Durable 所有实例合计的未确认消息上限
        # backOff: ["60s", "5m", "30m"]  # 各轮确认时限，非空时覆盖 ackWait
        # retryDelay: "0s"               # 0s 等待确认超时重投，正值延迟 NAK，须留空 backOff
        # consume:
        #   workers: 1      # 每个实例的并发处理数
        #   maxMessages: 0  # 预取上限，0 表示有效 workers 的两倍

# 订阅外部维护的 Stream 时，把下列条目加入 streams。existing 只查询，保留 name、mode 和 consumers。
#   - name: "EXTERNAL_TASKS"
#     mode: "existing"
#     consumers:
#       - durable: "external-worker"
#         mode: "upsert"
#         filterSubjects:
#           - "external.tasks"
#         handler: "HandleExternalTask"

# 修改后重启生效。移除订阅会停止本服务的消费，远端 Stream 和 Durable 继续保留。
