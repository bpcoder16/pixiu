# 复制为 aliyunesx.<name>.yaml，放在 app.yaml 同目录下。
# name 和 isDefault 由 MustRegisterAliyunES(name, isDefault) 声明。
# 每个客户端固定管理一个阿里云 ES InstanceID，多实例分别声明。
region: "cn-hangzhou"
instanceID: "es-example"

# 固定 AK/SK，两项必填；部署时填写实际值，不支持环境变量占位符替换。
accessKeyID: "<部署时填写 AK>"
accessKeySecret: "<部署时填写 SK>"

# 可选，空值按 Region 推导；内网或自定义地址须填写完整 HTTP(S) URL。
endpoint: ""

# 零值采用以下默认值，负值无效；调用方更短的 context 期限优先。
# 初始化不联网验活，没有 initTimeout。
requestTimeout: "60s"
slowThreshold: "200ms"

# 默认关闭全部结果日志；开启后不记录凭据、签名和正文，耗时登记独立生效。
logRequests: false
