# 与入口配置放在同一目录，文件名为 elasticsearch.<实例名>.yaml，实例名由 MustRegisterElasticsearch 声明。

version: 8  # 必填，与集群主版本一致，支持 7、8、9
addresses:  # 至少一个 HTTP(S) 节点或负载均衡地址，凭据单独填写
  - "https://es.example.com:9200"

# 基本认证填写用户名和密码，API Key 认证只填 apiKey。匿名访问时三项均留空。
username: ""
password: ""
apiKey: ""

caCertFile: ""  # 附加的 PEM CA 证书，留空使用默认信任配置。相对路径从本文件所在目录解析

startupTimeout: "5s"  # 启动时检查集群版本的总时限，默认 5s
dialTimeout: "5s"     # 单次建立连接的时限，默认 5s

# 每个实例独享一个 HTTP 连接池。
pool:
  maxIdleConns: 100        # 所有节点合计的空闲连接数上限
  maxIdleConnsPerHost: 10  # 每个节点的空闲连接数上限
  maxConnsPerHost: 0       # 每个节点的总连接数上限，0 沿用底层设置（通常不限）
  idleConnTimeout: "90s"   # 连接最长空闲时间

slowThreshold: "200ms"  # 慢请求阈值，默认 200ms
logRequests: true       # 记录请求结果（含慢请求和错误），关闭后仍统计耗时
logDetails: false       # 在请求日志中记录未经脱敏的请求和响应正文
