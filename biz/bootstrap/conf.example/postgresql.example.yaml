# 与 app.yaml 放在同一目录，文件名为 postgresql.<实例名>.yaml，实例名及默认实例由 MustRegisterPostgreSQL 声明。

master:
  host: "127.0.0.1"  # 必填，主库地址
  port: 5432         # 默认 5432

# 无从库时读主库，多个从库轮询读取。
slaves: []
# slaves:
#   - host: "replica.example.com"
#     port: 5432

# 主从共用以下连接参数。
database: "example"     # 必填，数据库名
username: "example"     # 必填，用户名
password: ""            # 密码，可留空
charset: "UTF8"         # 客户端编码，支持 UTF8 或 UTF-8
location: "UTC"         # Go 读取无时区时间戳时使用的时区
sessionTimeZone: "UTC"  # 数据库会话时区，留空沿用服务端设置

sslMode: "verify-full"  # 校验服务端证书和主机名，留空使用 prefer
sslRootCert: ""         # 用于校验服务端的根 CA 文件
sslCert: ""             # 客户端证书文件，与 sslKey 配套
sslKey: ""              # 客户端私钥文件

disableStatementCache: false  # 开启后禁用命名预备语句缓存，仍使用扩展查询协议
initTimeout: "10s"            # 所有主从连接共用的启动时限，默认 10s
dialTimeout: "3s"             # 单次建连时限，0s 表示不设驱动级超时

# 每个主库、从库各用一个连接池。
pool:
  maxOpenConns: 100      # 最大连接数
  maxIdleConns: 10       # 最大空闲连接数，不能超过 maxOpenConns
  connMaxLifetime: "3m"  # 连接最长使用时间
  connMaxIdleTime: "1m"  # 连接最长空闲时间

slowThreshold: "200ms"  # 慢查询阈值，默认 200ms
logSQL: true            # 记录正常查询 SQL，关闭后仍记录慢查询和错误
interpolateSQL: true    # 在日志中展开 SQL 参数，默认开启，可能包含敏感数据
