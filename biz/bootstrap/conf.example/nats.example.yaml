# 复制为 nats.<name>.yaml，放在 app.yaml 同目录下。
# name 和 isDefault 由 MustRegisterNATS(name, isDefault) 声明，文件内不重复配置。
# 连接、异步错误及消费链路使用此命名 Logger；在 app.yaml 的 log.names 中声明 nats。
# 省略、null、空值或未注册名称时回退默认 Logger；发布和 Request 始终跟随调用方 ctx。
loggerName: "nats"

# 可选环境前缀，省略、null 或空字符串时不启用；仅允许英文字母、数字、_、-。
# 初始化后固定；发布、Request 和注册均填写原始主题或名称，由客户端统一添加前缀。
# 例如 test1 将 orders.created 映射为 test1.orders.created，将 ORDERS 映射为 test1_ORDERS。
namespace: ""

# 列表中的地址属于同一个逻辑实例，不为每个地址创建独立客户端。
# 注册配置的 streamDefaults.replicas 省略或 null 时，使用初始化时本列表的条目数，不去重、不计入自动发现节点。
# 自动推导要求完整且不重复列出同一 JetStream 集群节点；仅列种子地址或使用代理入口时应显式配置 replicas。
urls:
  - "nats://127.0.0.1:4222"

# 不接受 URL 内嵌凭据；允许均为空，有密码时必须填写用户名。
username: ""
password: ""

# 零值采用以下默认值，负值无效；connectTimeout 是单次拨号而非全部地址总预算。
connectTimeout: "5s"
# 仅限制底层连接 Drain。
drainTimeout: "10s"
# 消费排空、异步确认等待、最终连接关闭共用此整体期限。
closeTimeout: "20s"

# 不负责启用或校验服务端 JetStream；依赖就绪后通过 NewNATSConsumerService
# 读取独立的 nats-register.<name>.yaml，服务 Run 时准备 Stream/Consumer。
jetStream:
  # 仅限制默认上下文的异步 PubAck 等待，不影响同步发布或 Consumer AckWait。
  publishAsyncTimeout: "5s"
