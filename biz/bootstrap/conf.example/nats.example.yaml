# 与入口配置放在同一目录，文件名为 nats.<实例名>.yaml，实例名由 MustRegisterNATS 声明。

# 同一实例至少填写一个节点地址。认证信息单独填写。
urls:
  - "nats://127.0.0.1:4222"
username: ""  # 认证用户名，可留空
password: ""  # 认证密码，填写时须同时提供用户名

namespace: ""   # 主题和资源名的前缀，限英文字母、数字和下划线，留空时使用原名

loggerName: "nats"  # 连接和消费日志使用的名称，未在 app.yaml 的 log.names 中注册时使用默认日志
logDetails: false   # 开启后记录完整消息正文和 Header，可能包含敏感数据

connectTimeout: "5s"  # 单次拨号超时，默认 5s
drainTimeout: "10s"   # 底层连接排空超时，默认 10s
closeTimeout: "20s"   # 客户端关闭的总时限，含排空和等待发布确认，默认 20s

jetStream:
  publishAsyncTimeout: "5s"  # 异步发布等待服务端确认的时限，默认 5s
