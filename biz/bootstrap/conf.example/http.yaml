# 由宿主读取为 httpserver.Config，用于配置 HTTP 监听和网络超时。

addr: ":8888"          # 监听所有网卡的 8888 端口
maxHeaderBytes: 65536  # 请求行和请求头的总大小上限，单位字节，默认 64 KiB

# 网络超时写明单位，0s 使用下列默认值。
readHeaderTimeout: "5s"  # 读取请求头的时限，须非负
readTimeout: "10s"       # 读取整个请求（含正文）的时限，负值表示不限时
writeTimeout: "15s"      # 写入响应的时限，负值表示不限时
idleTimeout: "60s"       # 等待同一连接下一个请求的时限，须非负
