# 与 app.yaml 放在同一目录，文件名为 mysql.<实例名>.yaml，实例名与代码声明一致。

master:
  host: "127.0.0.1"  # 必填，主库地址
  port: 3306         # 默认 3306

# 无从库时读主库，有多个从库时轮询读取。
slaves: []
# 配置从库时，用下面的列表替换上一行。
# slaves:
#   - host: "replica.example.com"
#     port: 3306

# 主从共用以下连接参数。
database: "example"        # 必填，数据库名
username: "example"        # 必填，用户名
password: ""               # 密码，可留空
charset: "utf8mb4"         # 连接字符集
location: "Asia/Shanghai"  # Go 解析时间值的时区
sessionTimeZone: "+08:00"  # MySQL 会话时区，留空沿用服务端设置
tlsConfig: ""              # 驱动的 TLS 配置名，留空关闭 TLS

initTimeout: "10s"  # 全部主从连接共用的启动时限，默认 10s
# 以下为驱动超时，0s 表示不设时限。
dialTimeout: "3s"   # 建立连接
readTimeout: "5s"   # 读取数据
writeTimeout: "5s"  # 写入数据

# 每个主库、从库各用一个连接池。
pool:
  maxOpenConns: 100      # 最大连接数
  maxIdleConns: 10       # 最大空闲连接数，不能超过 maxOpenConns
  connMaxLifetime: "3m"  # 连接最长使用时间
  connMaxIdleTime: "1m"  # 连接最长空闲时间

slowThreshold: "200ms"  # 超过此时长记为慢查询，默认 200ms
logSQL: true            # 记录正常查询 SQL。关闭后仍记录慢查询和错误
interpolateSQL: true    # 在日志中展开 SQL 参数，可能包含敏感数据
