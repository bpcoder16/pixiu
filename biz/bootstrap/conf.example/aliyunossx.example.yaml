# 与入口配置放在同一目录，文件名为 aliyunossx.<实例名>.yaml，实例名由 MustRegisterAliyunOSS 声明。

region: "cn-hangzhou"     # 必填，Bucket 所在地域
bucket: "example-assets"  # 必填，每个实例绑定一个 Bucket
endpoint: ""              # 留空使用地域公网地址，自定义地址填写完整 HTTP(S) URL

# 访问阿里云时填写固定 AccessKey，两项均必填。
accessKeyID: "<部署时填写 AK>"
accessKeySecret: "<部署时填写 SK>"

requestTimeout: "60s"   # 单次请求时限，默认 60s
slowThreshold: "500ms"  # 慢请求阈值，默认 500ms
logRequests: false      # 开启后记录请求结果，默认关闭
