# 与入口配置放在同一目录，文件名为 redis.<实例名>.yaml，实例名由 MustRegisterRedis 声明。

host: "127.0.0.1"  # 必填，单节点主机名或 IP，IPv6 地址不加方括号
port: 6379         # 默认 6379
username: ""       # ACL 用户名，留空使用默认用户
password: ""       # 启用认证时填写
db: 0              # 逻辑数据库编号，从 0 开始

# 启动时的 PING 也使用以下连接和读写超时，0s 沿用驱动默认值。
dialTimeout: "3s"   # 建立连接
readTimeout: "3s"   # 读取响应
writeTimeout: "3s"  # 发送命令
maxRetries: -1      # 命令重试次数，-1 关闭重试，0 使用默认的 3 次

pool:
  size: 100               # 连接池基础大小
  maxActiveConns: 0       # 每个池的连接数上限，0 表示不限
  minIdleConns: 10        # 最少空闲连接数
  maxIdleConns: 20        # 最多空闲连接数
  timeout: "4s"           # 等待可用连接的最长时间
  connMaxIdleTime: "30m"  # 连接最长空闲时间
  connMaxLifetime: "0s"   # 连接最长使用时间，0s 表示不限

# 命令日志包含请求参数，可能含敏感数据。
slowThreshold: "200ms"  # 慢命令阈值，默认 200ms
logCommands: true       # 记录正常命令，默认关闭。关闭后仍记录慢命令和错误
